plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.floaty.volume'
    compileSdk 34

    defaultConfig {
        applicationId 'com.floaty.volume'
        minSdk 26          // Android 8.0 Oreo and newer (8.x, 9, 10, 11, 12+)
        targetSdk 28       // Android 9 behaviour: overlay + foreground-service rules
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug {
            // Signed with the default debug key by AGP: installable straight from CI.
            minifyEnabled false
        }
        release {
            // Signed with the debug key as well so the sideloaded APK is stable across builds.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Intentionally dependency-free: framework widgets + AudioManager only.
}
