plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// A stable signing key is what lets a new APK install over the old one.
// CI generates it once and caches it; locally it is simply absent.
def keystoreFile = file(System.getenv("FLOATY_KEYSTORE") ?: "${rootDir}/keystore/floaty.jks")
def hasKeystore = keystoreFile.exists()

android {
    namespace 'com.floaty.volume'
    compileSdk 34

    defaultConfig {
        applicationId 'com.floaty.volume'
        minSdk 26          // Android 8.0 Oreo and newer (8.x, 9, 10, 11, 12+)
        targetSdk 28       // Android 9 behaviour: overlay + foreground-service rules
        versionCode 8
        versionName '1.4.3'
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile keystoreFile
                storePassword System.getenv("FLOATY_STORE_PASS") ?: "floatyvolume"
                keyAlias System.getenv("FLOATY_KEY_ALIAS") ?: "floaty"
                keyPassword System.getenv("FLOATY_KEY_PASS") ?: "floatyvolume"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // R8 removes the unused Kotlin stdlib and optimises the bytecode:
            // the shipped APK is ~3x smaller and starts faster on weak hardware.
            minifyEnabled true
            shrinkResources true
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    // Drop Kotlin metadata files and other build-time junk from the APK:
    // they are never read at runtime but cost ~11 KB.
    packaging {
        resources {
            excludes += [
                "kotlin/**",
                "META-INF/**",
                "DebugProbesKt.bin",
                "**/*.kotlin_builtins",
                "**/*.kotlin_metadata"
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Intentionally dependency-free: framework widgets + AudioManager only.
}
